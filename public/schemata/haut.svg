<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="system-ui, sans-serif" font-size="15">
  <title>Schema: Schichten der Haut</title>
  <rect width="520" height="470" fill="#fbfaf7"/>
  <text x="16" y="28" font-size="17" font-weight="600" fill="#333">Haut im Querschnitt (Schema, nicht maßstabsgetreu)</text>
  <!-- Epidermis -->
  <path d="M20 70 Q60 62 100 70 T180 70 T260 70 T340 70" fill="none"/>
  <rect x="20" y="60" width="320" height="14" fill="#e9c9a8"/>
  <path d="M20 74 L340 74 L340 104 Q320 96 300 108 Q280 96 260 108 Q240 96 220 108 Q200 96 180 108 Q160 96 140 108 Q120 96 100 108 Q80 96 60 108 Q40 96 20 108 Z" fill="#f2d5b8" stroke="#c99c74"/>
  <!-- Dermis -->
  <path d="M20 108 Q40 96 60 108 Q80 96 100 108 Q120 96 140 108 Q160 96 180 108 Q200 96 220 108 Q240 96 260 108 Q280 96 300 108 Q320 96 340 104 L340 250 L20 250 Z" fill="#f5c9c2" stroke="#c98a80"/>
  <g stroke="#d9a39b" stroke-width="1.5" fill="none"><path d="M40 160 q30 -20 60 0 t60 0 t60 0 t60 0 t60 0 M40 200 q30 -20 60 0 t60 0 t60 0 t60 0 t60 0"/></g>
  <!-- Haar + Talgdrüse -->
  <path d="M110 40 L118 74 L122 230" stroke="#5a4635" stroke-width="3" fill="none"/>
  <ellipse cx="122" cy="232" rx="10" ry="8" fill="#a97d5d"/>
  <ellipse cx="138" cy="150" rx="10" ry="7" fill="#f7e48b" stroke="#c9b13b"/>
  <!-- Schweißdrüse -->
  <path d="M250 74 Q246 140 254 200 q8 18 -6 26 q-14 -8 4 -22" stroke="#4f8fbf" stroke-width="2.5" fill="none"/>
  <!-- Gefäße -->
  <path d="M20 240 Q120 228 200 242 T340 236" stroke="#cf3e3e" stroke-width="4" fill="none"/>
  <path d="M20 246 Q120 252 200 246 T340 250" stroke="#3e64cf" stroke-width="4" fill="none"/>
  <!-- Subcutis -->
  <rect x="20" y="250" width="320" height="130" fill="#fbecb0" stroke="#d9c06a"/>
  <g fill="#fff6cf" stroke="#d9c06a">
    <circle cx="50" cy="285" r="18"/><circle cx="92" cy="300" r="20"/><circle cx="140" cy="280" r="17"/><circle cx="185" cy="310" r="21"/>
    <circle cx="232" cy="285" r="18"/><circle cx="280" cy="305" r="20"/><circle cx="318" cy="280" r="15"/><circle cx="62" cy="345" r="20"/>
    <circle cx="120" cy="345" r="18"/><circle cx="170" cy="355" r="17"/><circle cx="225" cy="345" r="20"/><circle cx="290" cy="350" r="19"/>
  </g>
  <!-- Faszie -->
  <rect x="20" y="380" width="320" height="10" fill="#cfd8e3" stroke="#8fa2b8"/>
  <rect x="20" y="390" width="320" height="40" fill="#d98b84"/>
  <!-- Beschriftungen -->
  <g fill="#222">
    <line x1="340" y1="84" x2="360" y2="84" stroke="#666"/><text x="364" y="80" font-weight="600">Epidermis</text><text x="364" y="97" font-size="13" fill="#555">Oberhaut, gefäßfrei</text>
    <line x1="340" y1="180" x2="360" y2="180" stroke="#666"/><text x="364" y="176" font-weight="600">Dermis</text><text x="364" y="193" font-size="13" fill="#555">Lederhaut: Fasern, Drüsen,</text><text x="364" y="208" font-size="13" fill="#555">Haarwurzeln, Nerven</text>
    <line x1="340" y1="315" x2="360" y2="315" stroke="#666"/><text x="364" y="311" font-weight="600">Subcutis</text><text x="364" y="328" font-size="13" fill="#555">Unterhaut: Fettläppchen</text>
    <line x1="340" y1="385" x2="360" y2="385" stroke="#666"/><text x="364" y="389">Körperfaszie</text>
    <line x1="340" y1="410" x2="360" y2="410" stroke="#666"/><text x="364" y="414">Muskel</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="60" y="54">Haar</text><text x="150" y="146">Talgdrüse</text><text x="262" y="160">Schweißdrüse</text><text x="214" y="268" fill="#a33">Arterie / Vene</text>
  </g>
  <text x="16" y="458" font-size="12" fill="#666">Eigenes Schema für „Anatomie lernen“ – CC BY-SA 4.0</text>
</svg>
